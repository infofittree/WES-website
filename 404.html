<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Westmount Energy Solutions</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Smart extensionless URL router for GitHub Pages
    (function() {
      var path = window.location.pathname;
      // If path ends without .html and isn't root, try redirecting to [path].html
      var knownPages = ['about', 'services', 'equipment', 'process', 'contact'];
      for (var i = 0; i < knownPages.length; i++) {
        var page = knownPages[i];
        if (path.endsWith('/' + page) || path.endsWith('/' + page + '/')) {
          window.location.replace('/WES_website/' + page + '.html');
          return;
        }
      }
    })();
  </script>
  <style>
    .not-found-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .not-found-code {
      font-size: 6rem;
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="not-found-wrapper">
    <div class="not-found-code">404</div>
    <h2 style="color: var(--primary); margin-bottom: 16px;">Page Not Found</h2>
    <p style="color: var(--gray); max-width: 480px; margin-bottom: 28px;">
      The page you're looking for doesn't exist or may have been typed with different capitalization.
    </p>
    <a href="/WES_website/" class="btn btn-primary">Return to Homepage</a>
  </div>
</body>
</html>
